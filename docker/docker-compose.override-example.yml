services:
  #dic1-fhir:
    #image: datasharingframework/fhir
  dic1-bpe:
    #image: datasharingframework/bpe
    environment:
      DEV_DSF_BPE_PROCESS_EXCLUDED: >-
        medizininformatik-initiativede_coordinateDataSharing|1.0,
        medizininformatik-initiativede_coordinateDataSharing|1.1,
        medizininformatik-initiativede_coordinateDataSharing|2.1,
        medizininformatik-initiativede_mergeDataSharing|1.0,
        medizininformatik-initiativede_mergeDataSharing|1.1,
        medizininformatik-initiativede_mergeDataSharing|2.0,
        medizininformatik-initiativede_dataReceive|1.0,
        medizininformatik-initiativede_dataReceive|1.1,
        medizininformatik-initiativede_dataReceive|2.0,
        medizininformatik-initiativede_reportReceive|1.0,
        medizininformatik-initiativede_reportReceive|1.1,
        medizininformatik-initiativede_reportReceive|1.2,
        medizininformatik-initiativede_reportReceive|2.0,
        medizininformatik-initiativede_feasibilityRequest|0.0

      # Report-2.x ENV variables
      #DE_MEDIZININFORMATIK_INITIATIVE_REPORT_DIC_EMAIL_ENABLED: 'true'
      DE_MEDIZININFORMATIK_INITIATIVE_REPORT_DIC_FHIR_SERVER_ID: dic1-fhir-store
      DE_MEDIZININFORMATIK_INITIATIVE_REPORT_DIC_STATUS_TIMER_INTERVAL: 'PT2M'
      #DE_MEDIZININFORMATIK_INITIATIVE_REPORT_DIC_HRP_IDENTIFIER: 'Test_HRP'

      # Report-1.x ENV variables
      DE_MEDIZININFORMATIK_INITIATIVE_REPORT_DIC_FHIR_SERVER_BASE_URL: http://dic1-fhir-store:8080/fhir
      #DE_MEDIZININFORMATIK_INITIATIVE_REPORT_DIC_FHIR_SERVER_ASYNC_ENABLED: 'true'
      #DE_MEDIZININFORMATIK_INITIATIVE_REPORT_DIC_FHIR_DATALOGGINGENABLED: 'true'

      # Feasibility-1.0.0.X ENV variables
      DE_MEDIZININFORMATIK_INITIATIVE_FEASIBILITY_DSF_PROCESS_CLIENT_STORE_BASE_URL: http://dic1-fhir-store:8080/fhir
      DE_MEDIZININFORMATIK_INITIATIVE_FEASIBILITY_DSF_PROCESS_CLIENT_STORE_TRUST_STORE_PATH: /run/secrets/root_ca.p12
      DE_MEDIZININFORMATIK_INITIATIVE_FEASIBILITY_DSF_PROCESS_CLIENT_STORE_TRUST_STORE_PASSWORD: password
      DE_MEDIZININFORMATIK_INITIATIVE_FEASIBILITY_DSF_PROCESS_EVALUATION_STRATEGY: cql
      DE_MEDIZININFORMATIK_INITIATIVE_FEASIBILITY_DSF_PROCESS_EVALUATION_OBFUSCATE: 'true'

      # Feasibility-1.0.1.X ENV variables
      DE_MEDIZININFORMATIK_INITIATIVE_FEASIBILITY_DSF_PROCESS_CONFIGURATION: |
        stores:
          dic1-fhir-store:
            baseUrl: http://dic1-fhir-store:8080/fhir
            evaluationStrategy: cql
            trustedCACertificates: /run/secrets/root_ca.crt
        networks:
          medizininformatik-initiative.de:
            obfuscate: true
            rateLimit:
              count: 100
              interval: PT1H
            stores:
            - dic1-fhir-store

      # Data-Transfer-2.x ENV variables
      #DE_MEDIZININFORMATIK_INITIATIVE_DATA_TRANSFER_DIC_EMAIL_ENABLED: 'true'
      DE_MEDIZININFORMATIK_INITIATIVE_DATA_TRANSFER_DIC_FHIR_SERVER_ID: dic1-fhir-store
      #DE_MEDIZININFORMATIK_INITIATIVE_DATA_TRANSFER_DIC_FHIR_SERVER_BINARY_STREAM_READ_ENABLED: 'true'
      #DE_MEDIZININFORMATIK_INITIATIVE_DATA_TRANSFER_DIC_FHIR_SERVER_BINARY_STREAM_READ_USE_HAPI_BLOB_STORAGE_OPERATION: 'true'
      DE_MEDIZININFORMATIK_INITIATIVE_DATA_TRANSFER_DIC_STATUS_TIMER_INTERVAL: 'PT2M'
      #DE_MEDIZININFORMATIK_INITIATIVE_DATA_TRANSFER_PROCESS_AUTHORIZATION_ADDITIONALLY_ALLOWED_SENDERS: 'nct.dkfz.de|DIC'
      #DE_MEDIZININFORMATIK_INITIATIVE_DATA_TRANSFER_PROCESS_AUTHORIZATION_ADDITIONALLY_ALLOWED_RECEIVERS: 'nct.dkfz.de|DMS'

      # Data-Transfer-1.x ENV variables
      DE_MEDIZININFORMATIK_INITIATIVE_DATA_TRANSFER_DIC_FHIR_SERVER_BASE_URL: http://dic1-fhir-store:8080/fhir
      #DE_MEDIZININFORMATIK_INITIATIVE_DATA_TRANSFER_DIC_FHIR_DATALOGGINGENABLED: 'true'

      # Data-Sharing-2.x ENV variables
      #DE_MEDIZININFORMATIK_INITIATIVE_DATA_SHARING_DIC_EMAIL_ENABLED: 'true'
      DE_MEDIZININFORMATIK_INITIATIVE_DATA_SHARING_DIC_FHIR_SERVER_ID: dic1-fhir-store
      #DE_MEDIZININFORMATIK_INITIATIVE_DATA_SHARING_DIC_FHIR_SERVER_BINARY_STREAM_READ_ENABLED: 'true'
      #DE_MEDIZININFORMATIK_INITIATIVE_DATA_SHARING_DIC_FHIR_SERVER_BINARY_STREAM_READ_USE_HAPI_BLOB_STORAGE_OPERATION: 'true'
      DE_MEDIZININFORMATIK_INITIATIVE_DATA_SHARING_DIC_STATUS_TIMER_INTERVAL: 'PT2M'

      # Data-Sharing-1.x ENV variables
      DE_MEDIZININFORMATIK_INITIATIVE_DATA_SHARING_DIC_FHIR_SERVER_BASE_URL: http://dic1-fhir-store:8080/fhir
      #DE_MEDIZININFORMATIK_INITIATIVE_DATA_SHARING_DIC_FHIR_DATALOGGINGENABLED: 'true'

