      DE_MEDIZININFORMATIK_INITIATIVE_REPORT_DIC_FHIR_SERVER_ID: dic2-fhir-store
      DE_MEDIZININFORMATIK_INITIATIVE_REPORT_DIC_STATUS_TIMER_INTERVAL: 'PT2M'
